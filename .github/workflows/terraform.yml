name: Deploy NPM App

on:
  pull_request:
    branches:
      - devel
      - stage
      - prod
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch build run-id via REST API
        id: find_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-app.yml/runs?head_sha=${{ github.event.pull_request.head.sha }}&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')
          echo "::set-output name=id::$RUN_ID"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          run-id: ${{ steps.find_run.outputs.id }}
          path: ./build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
